<style>
/* Layout: clinical ledger app — left rail on wide screens, bottom tab bar on phones; cards only for records */
:root{
  --bg:#eef3f4; --surface:#ffffff; --sunk:#f6f9f9; --ink:#10282f; --muted:#587078; --line:#d4e0e3;
  --accent:#0a6a7a; --accent-ink:#ffffff; --pulse:#c4303a; --warn:#a8680f; --ok:#22784a;
  --warn-bg:#fbf1df; --pulse-bg:#fbe7e8; --saffron:#d2620a; --saffron-bg:#fde9d6; --blue:#1f5fbf; --blue-bg:#e2ecfb; --ok-bg:#e3f3ea; --accent-bg:#e1f0f2;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c181c; --surface:#122428; --sunk:#0f1f23; --ink:#e2edef; --muted:#8aa3aa; --line:#24393f;
  --accent:#4cb4c4; --accent-ink:#06191d; --pulse:#f06a72; --warn:#e3b052; --ok:#5cc58b;
  --warn-bg:#2e2513; --pulse-bg:#33171a; --saffron:#ff9a3d; --saffron-bg:#35220f; --blue:#7fb0ff; --blue-bg:#14243d; --ok-bg:#132c20; --accent-bg:#123238; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#4cb4c4; --accent-ink:#06191d; --pulse:#f06a72; --warn:#e3b052; --ok:#5cc58b;
  --warn-bg:#2e2513; --pulse-bg:#33171a; --saffron:#ff9a3d; --saffron-bg:#35220f; --blue:#7fb0ff; --blue-bg:#14243d; --ok-bg:#132c20; --accent-bg:#123238; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{min-width:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand>div{min-width:0}
.brand b{font-family:var(--f-display);font-size:.9rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#cosel,#cosel2{width:100%;max-width:100%;min-width:0;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-bg);color:var(--accent)}
.nav .dot{margin-left:auto;background:var(--pulse);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;line-height:18px}
.rail .sync{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px 10px}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 96px;max-width:1100px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--pulse)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.tile .v{font-family:var(--f-display);font-size:clamp(.9rem,3.9vw,1.35rem);line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;max-width:100%;overflow-wrap:anywhere}
.tile{min-width:0;overflow:hidden}.tile>*{min-width:0;max-width:100%;overflow-wrap:anywhere}
.tile.alert .v{color:var(--pulse)} .tile.warn .v{color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .wrap{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.thumb{width:46px;height:46px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.red{background:var(--pulse-bg);color:var(--pulse)} .pill.amber{background:var(--warn-bg);color:var(--warn)}
.pill.green{background:var(--ok-bg);color:var(--ok)} .pill.teal{background:var(--accent-bg);color:var(--accent)}
.pill.saffron{background:var(--saffron-bg);color:var(--saffron)} .pill.blue{background:var(--blue-bg);color:var(--blue)}
.xt-red{color:var(--pulse)} .xt-saffron{color:var(--saffron)} .xt-blue{color:var(--blue)}
.pill.grey{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,24,.45);z-index:30;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px}
.sheet-b{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.78rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.photo{display:flex;gap:14px;align-items:center}
.photo .ph{width:96px;height:96px;border-radius:10px;border:1.5px dashed var(--line);background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);flex:none}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.lines{display:flex;flex-direction:column;gap:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:2fr 1.3fr 1fr .8fr 1fr .7fr auto;gap:8px;align-items:end}
.line .f label{font-size:.7rem}
.line.out{grid-template-columns:1.8fr 1.05fr 1.5fr .75fr .7fr .9fr .6fr auto}
.line.sub{margin-left:22px;border-left:3px solid var(--accent)}
@media (max-width:820px){.line.out{grid-template-columns:1fr 1fr 1fr}.line.sub{margin-left:10px}}
@media (max-width:440px){.line.out{grid-template-columns:1fr 1fr}}
.payline{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.line.hbl{grid-template-columns:150px 2fr 1fr 1fr;position:relative;padding-top:22px}.hbl .hbn{position:absolute;top:6px;left:12px;font-size:.75rem}.hbl .hbh{grid-column:span 2}.hbl .hbx{position:absolute;top:4px;right:6px;padding:2px 8px}.hbl .f.hbp{min-width:0}
@media (max-width:600px){.line.hbl{grid-template-columns:1fr 1fr}.hbl .hbp{grid-column:1/-1}.hbl .hbh{grid-column:1/-1}}
.payline>button{justify-self:start;align-self:end}
@media (max-width:820px){.payline{grid-template-columns:1fr 1fr}}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.totals .g{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.note.bad{background:var(--pulse-bg);color:var(--ink)}
.billview{background:#fff;color:#111;padding:18px;border-radius:8px;font-family:Arial,sans-serif;font-size:12px;overflow-x:auto}
.billview table{border-collapse:collapse;width:100%;min-width:560px}.billview th,.billview td{border:1px solid #999;padding:4px;color:#111}.billview th{background:#e1f0f2}
.note{background:var(--accent-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-weight:600;font-size:.9rem}
.confirm{background:var(--pulse-bg);border:1px solid var(--pulse);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bal-dr{color:var(--pulse);font-weight:700} .bal-cr{color:var(--ok);font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{user-select:none}
.paste{border:1.5px dashed var(--line);border-radius:8px;padding:10px;font-size:.82rem;color:var(--muted);background:var(--sunk);min-height:40px;outline:none}
.paste:focus{border-color:var(--accent)}
.copybox{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}

.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabbar .nav{flex:1;flex-direction:column;gap:2px;font-size:.68rem;padding:6px 2px;align-items:center;position:relative}
  .tabbar .nav .dot{position:absolute;top:2px;right:18%;margin:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr 1fr}
  .line .f.prod{grid-column:1/-1}
  main{padding-block:16px 96px}
  .mob-brand{display:flex}
}
@media (min-width:821px){.mob-brand{display:none}}
.mob-brand{align-items:center;gap:8px;margin-bottom:12px}
.mob-top{flex-wrap:wrap;row-gap:10px}
.mob-top>svg{flex:none}
.mb-name{flex:1 1 0;min-width:0}
.mb-name b{font-family:var(--f-display);font-size:1rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mb-sync{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-act{flex:1 1 100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mb-act .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){
  .tabbar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar .nav{flex:1 0 auto;min-width:64px;padding:6px 8px;white-space:nowrap;scroll-snap-align:center}
  .tabbar .nav .dot{right:6px}
  h1{font-size:1.3rem} h2{font-size:1.05rem} h3{font-size:.98rem}
  .panel-h{flex-wrap:wrap;padding:12px 14px}
  .panel-h>div:first-child{flex:1 1 220px;min-width:0}
  .topbar{align-items:flex-start}
  .topbar>div:first-child{flex:1 1 220px;min-width:0}
}
@media (max-width:440px){.form{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>

/* ---------- company-wise stock register: stock in/out per company and product ---------- */
function stockMoves(co,pid){const rows=[];const E=stockEntries();vList().sort(byDate).forEach(v=>{if(co&&coOf(v)!==co)return;if(hidePc(v)||isCO(v))return;let dir=0;
  if(v.type==='purchase'||v.type==='sreturn')dir=1;else if(v.type==='pchallan'){if(pcBilled(v))return;dir=1}
  else if(v.type==='challan'||v.type==='preturn')dir=-1;else if(v.type==='sale'){if(v.fromChallan)return;dir=-1}else return;
  (v.items||[]).forEach(it=>{if(!it.pid||(pid&&it.pid!==pid))return;const q=+it.qty||0;if(!q)return;const e=dir<0?entryOf(it,E):null;const cu=dir>0&&(v.type!=='sreturn'||it.nl)?(+it.rate||0):(costOf(it,E)||0);
    rows.push({v,it,pid:it.pid,co:coOf(v),date:v.date,inq:dir>0?q:0,outq:dir<0?q:0,cu,val:(dir>0?q:-q)*cu,lot:it.lot||(e&&e.lot)||'',exp:it.exp||(e&&e.exp)||'',loc:dir>0?(it.loc??v.loc??''):(e?e.loc||'':'')})})});return rows}
function regRegCo(){return ui.rco===undefined?(ui.co||''):ui.rco}
function regSummary(co,prods){const mv=stockMoves(co);const m={};mv.forEach(r=>{const k=r.pid;m[k]=m[k]||{inq:0,outq:0,by:{},val:0};m[k].inq+=r.inq;m[k].outq+=r.outq;m[k].val+=r.val;m[k].by[r.co]=(m[k].by[r.co]||0)+r.inq-r.outq});
  return prods.filter(([id])=>m[id]).map(([id,p])=>({id,p,...m[id],bal:m[id].inq-m[id].outq}))}
function regRows(co,pid){let bal=0,bv=0;return stockMoves(co,pid).map(r=>{bal+=r.inq-r.outq;bv+=r.val;return{...r,bal,bv}})}
function vRegister(prods){const sc=can('cost');const co=regRegCo();const cos=coList();const pid=ui.rpid&&S.products[ui.rpid]?ui.rpid:'';const q=ui.pq.toLowerCase();

  if(pid){const p=S.products[pid];const rows=regRows(co,pid);const ti=rows.reduce((a,r)=>a+r.inq,0),to=rows.reduce((a,r)=>a+r.outq,0);

     ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Voucher</th>${co?'':'<th>Company</th>'}<th>Party</th><th>Lot</th><th>Expiry</th><th>Location</th><th class="num">In</th><th class="num">Out</th>${sc?'<th class="num">Cost/unit</th><th class="num">Value</th>':''}<th class="num">Balance</th>${sc?'<th class="num">Stock value</th>':''}</tr></thead><tbody>
     ${rows.map(r=>`<tr data-voucher="${r.v.id}" style="cursor:pointer"><td style="white-space:nowrap">${fdate(r.date)}</td><td>${esc(VT[r.v.type].label)} <span class="mono">${esc(r.v.no||'')}</span></td>${co?'':`<td>${esc(coShort(r.co))}</td>`}<td>${esc((S.parties[r.v.partyId]||{}).name||'')}</td><td class="mono">${esc(r.lot)}</td><td>${fexp(r.exp)}</td><td>${esc(locName(r.loc))}</td><td class="num">${r.inq||''}</td><td class="num">${r.outq||''}</td>${sc?`<td class="num">${inr(r.cu)}</td><td class="num">${r.val<0?'−':''}${inr(Math.abs(r.val))}</td>`:''}<td class="num"><b>${r.bal}</b></td>${sc?`<td class="num"><b>${inr(r.bv)}</b></td>`:''}</tr>`).join('')}
     <tr><td colspan="${co?6:7}"><b>Total</b></td><td class="num"><b>${ti}</b></td><td class="num"><b>${to}</b></td>${sc?'<td></td><td></td>':''}<td class="num"><b>${ti-to}</b></td>${sc?`<td class="num"><b>${inr(rows.length?rows[rows.length-1].bv:0)}</b></td>`:''}</tr></tbody></table></div>`:'<div class="empty">No stock movement for this product'+(co?' in this company':'')+'.</div>'}</section>`+note}

   ${list.map(x=>`<tr data-rpid="${x.id}" style="cursor:pointer"><td>${esc(x.p.name)}</td><td class="mono">${esc(x.p.hsn||'')}</td><td class="num">${x.inq}</td><td class="num">${x.outq}</td>${showCos?cos.map(c=>`<td class="num">${x.by[c.id]||0}</td>`).join(''):''}<td class="num"><b>${x.bal}</b></td>${sc?`<td class="num">${x.val<0?'−':''}${inr(Math.abs(x.val))}</td>`:''}</tr>`).join('')}
   <tr><td colspan="2"><b>Total</b></td><td class="num"><b>${list.reduce((a,x)=>a+x.inq,0)}</b></td><td class="num"><b>${list.reduce((a,x)=>a+x.outq,0)}</b></td>${showCos?cos.map(c=>`<td class="num"><b>${list.reduce((a,x)=>a+(x.by[c.id]||0),0)}</b></td>`).join(''):''}<td class="num"><b>${list.reduce((a,x)=>a+x.bal,0)}</b></td>${sc?`<td class="num"><b>${inr(list.reduce((a,x)=>a+x.val,0))}</b></td>`:''}</tr></tbody></table></div>`:'<div class="empty">No stock movement found.</div>'}</section>`+note+(sc?'<div class="muted" style="font-size:.84rem;margin-top:4px">Stock value is at purchase cost: goods in at the bill rate, goods out at the cost of the stock entry they came from (GST excluded). Shown only to Admin and Manager.</div>':'')}

/* ---------- non-moving report: days since last sale/challan out, for products still in stock ---------- */
function nonMovingRows(prods){
  const E=stockEntries();const t=today();const lastOut={},lastIn={};
  vList().forEach(v=>{if(!v.date||isCO(v))return;const out=v.type==='challan'||(v.type==='sale'&&!v.fromChallan);const inn=v.type==='purchase';if(!out&&!inn)return;
    (v.items||[]).forEach(it=>{if(!it.pid)return;const m=out?lastOut:lastIn;if(!m[it.pid]||v.date>m[it.pid])m[it.pid]=v.date})});
  return prods.map(([id,p])=>{const es=Object.values(E).filter(e=>e.pid===id&&e.qty>0);const qty=es.reduce((a,e)=>a+e.qty,0);if(qty<=0)return null;
    const value=es.reduce((a,e)=>a+(e.orphan?0:e.qty*e.cost),0);
    const oldest=es.filter(e=>e.date).map(e=>e.date).sort()[0]||'';
    const since=lastOut[id]||oldest;const days=since?dayDiff(t,since):null;
    return{id,p,qty,value,lastOut:lastOut[id]||'',lastIn:lastIn[id]||'',oldest,days,lots:new Set(es.map(e=>e.lot)).size}}).filter(Boolean).sort((a,b)=>(b.days??-1)-(a.days??-1));
}
/* Short / excess: commission-only quantities (before 25 Oct 2026) against stock on hand */
function coRows(){const av=availStock();const m={};
  vList().filter(v=>isCO(v)&&inCo(v)&&(v.type==='challan'||(v.type==='sale'&&!v.fromChallan))).sort(byDate).forEach(v=>(v.items||[]).forEach(it=>{if(!it.pid)return;const r=m[it.pid]=m[it.pid]||{pid:it.pid,qty:0,bills:[]};r.qty+=+it.qty||0;if(!r.bills.includes(v.no))r.bills.push(v.no)}));
  return Object.values(m).map(r=>{const st=av[r.pid]||0;return{...r,stock:st,short:Math.max(0,r.qty-st),excess:Math.max(0,st-r.qty)}}).sort((a,b)=>pName(a.pid).localeCompare(pName(b.pid)))}
function vShortExcess(){const rs=coRows();const sh=rs.filter(r=>r.short>0),ex=rs.filter(r=>r.excess>0);
  const tbl=(list,k,lbl)=>list.length?`<div class="tbl-wrap"><table><thead><tr><th>Product</th><th class="num">Commission-only qty</th><th class="num">Stock on hand</th><th class="num">${lbl}</th><th>Bills / challans</th></tr></thead><tbody>${list.map(r=>`<tr data-prod="${r.pid}" style="cursor:pointer"><td>${esc(pName(r.pid))}</td><td class="num">${r.qty}</td><td class="num">${r.stock}</td><td class="num"><span class="pill ${k==='short'?'red':'amber'}">${r[k]}</span></td><td class="mono" style="font-size:.8rem">${esc(r.bills.slice(0,6).join(', '))}${r.bills.length>6?' +'+(r.bills.length-6):''}</td></tr>`).join('')}</tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${list.reduce((a,r)=>a+r.qty,0)}</b></td><td class="num"><b>${list.reduce((a,r)=>a+r.stock,0)}</b></td><td class="num"><b>${list.reduce((a,r)=>a+r[k],0)}</b></td><td></td></tr></tfoot></table></div>`:`<div class="empty"><b>Nothing ${k}</b></div>`;
  return `<div class="note">Products entered as <b>commission only</b> on sales and challans dated before ${fdate(CO_BEFORE)} do not reduce stock. This compares those quantities with stock on hand today. <b>Short</b> = more was entered than is in stock. <b>Excess</b> = stock left over after those quantities.</div>

  <section class="panel"><div class="panel-h"><h2>Excess · ${ex.length} product(s)</h2></div>${tbl(ex,'excess','Excess qty')}</section>`}

  </tbody></table></div></section>`;

function csvNonMoving(){const q=ui.pq.toLowerCase();const prods=Object.entries(S.products).filter(([id,p])=>(ui.cat==='all'||p.cat===ui.cat)&&(!q||[p.name,p.hsn,p.brand,p.code].join(' ').toLowerCase().includes(q)));

/* ---------- staff tasks & work reminders ---------- */
const TASK_UP=2;
const REPEATS={'':'Does not repeat',daily:'Every day',weekly:'Every week',monthly:'Every month'};
const userName=id=>{const u=S.users[id];return u?(u.name||u.username):''};
const canAssign=()=>!usersOn()||!!(cu&&(cu.role==='Admin'||cu.role==='Manager'));
const tList=()=>Object.entries(S.tasks||{}).map(([id,t])=>({id,...t}));
const isMine=t=>!usersOn()||!t.assignee||!!(cu&&t.assignee===cu.id);

function taskState(t){if(t.status==='done')return{cls:'green',txt:'Done'};if(!t.due)return{cls:'grey',txt:'No date'};const d=dayDiff(t.due,today());return d<0?{cls:'red',txt:(-d)+'d overdue'}:d===0?{cls:'amber',txt:'Due today'}:{cls:'blue',txt:'In '+d+'d'}}
const myOpenTasks=()=>tList().filter(t=>t.status!=='done'&&isMine(t));
const myDueTasks=()=>myOpenTasks().filter(t=>t.due&&dayDiff(t.due,today())<=TASK_UP).sort((a,b)=>a.due.localeCompare(b.due)||(a.pri==='high'?-1:0)-(b.pri==='high'?-1:0));
const myTaskAlert=()=>myOpenTasks().filter(t=>t.due&&t.due<=today()).length;
function nextDue(due,r){if(r==='daily')return addDays(due,1);if(r==='weekly')return addDays(due,7);if(r==='monthly'){const[y,m,d]=due.split('-').map(Number);const nd=new Date(y,m,1);const last=new Date(y,m+1,0).getDate();return `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}return ''}
const tWhen=t=>t?new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}):'';
function taskItem(t){const st=taskState(t);const done=t.status==='done';const who=usersOn()&&t.assignee?userName(t.assignee)||'Removed user':'';const canTick=isMine(t)||canAssign();
  return `<div class="item" style="cursor:default">${canTick?`<button class="btn sm ${done?'':'primary'}" data-act="${done?'taskReopen':'taskDone'}" data-tid="${t.id}" style="min-width:64px;justify-content:center">${done?'Undo':'Done'}</button>`:''}
   <button type="button" data-act="editTask" data-tid="${t.id}" class="main" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit"><div class="t" style="${done?'text-decoration:line-through;color:var(--muted)':''}">${t.pri==='high'?'<span class="pill red">High</span> ':''}${usersOn()&&!t.assignee?'<span class="pill teal">Open task</span> ':''}${esc(t.title)}</div><div class="s">${[who&&'For '+esc(who),(t.remarks||[]).length&&'💬 '+t.remarks.length+' · '+esc(((t.remarks[t.remarks.length-1]||{}).text||'').slice(0,40)),t.due&&'Due '+fdate(t.due),t.repeat&&REPEATS[t.repeat],done&&t.doneBy&&userName(t.doneBy)&&'Done by '+esc(userName(t.doneBy)),t.note&&esc(t.note)].filter(Boolean).join(' · ')}</div></button>
   <span class="pill ${st.cls}">${st.txt}</span></div>`}

/* ---------- pending work: day-wise per user, report for Admin ---------- */

  tList().filter(t=>t.status!=='done'&&(uid?t.assignee===uid:true)).forEach(t=>out.push({d:t.due||'',kind:'Task',label:t.title+(t.pri==='high'?' (high)':''),tid:t.id}));

  if(!uid||role==='Admin'||role==='Manager')vList().filter(pcNoPrice).forEach(v=>out.push({d:v.date,kind:'Purchase challan: add prices',label:`${v.no} · ${(S.parties[v.partyId]||{}).name||''}`,vid:v.id,since:true}));
  if(usersOn()&&(!uid||role==='Admin')){const n=apprList().filter(a=>a.status==='pending').length;if(n)out.push({d:t0,kind:'Approvals',label:n+' change(s) waiting for approval',go:'appr'})}
  return out.sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'))}

function myPending(){if(!usersOn())return pendingFor('');return [...pendingFor(cu?cu.id:''),...openTasksPW()].sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'))}
const pwSoon=items=>items.filter(x=>x.d&&(x.since||dayDiff(x.d,today())<=TASK_UP));
function pwDayLabel(x){if(!x.d)return 'No date';if(x.since)return 'Pending since '+fdate(x.d);const k=dayDiff(x.d,today());return k<0?'Overdue · '+fdate(x.d):k===0?'Today':k===1?'Tomorrow':fdate(x.d)}
function pwGroups(items){const g=[];items.forEach(x=>{const L=x.since?'Pending (not done yet)':!x.d?'No date':dayDiff(x.d,today())<0?'Overdue':pwDayLabel(x);let o=g.find(y=>y.L===L);if(!o)g.push(o={L,items:[]});o.items.push(x)});
  const ord=L=>L==='Overdue'?0:L.startsWith('Pending')?1:L==='Today'?2:L==='Tomorrow'?3:L==='No date'?9:4;return g.sort((a,b)=>ord(a.L)-ord(b.L))}

function pwPanel(items,title){if(!items.length)return '';return `<section class="panel"><div class="panel-h"><h3>${title} · ${items.length}</h3><button class="btn sm" data-go="tasks">Tasks</button></div>${pwGroups(items).map(g=>`<div class="muted" style="padding:8px 16px 2px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${esc(g.L)} · ${g.items.length}</div><div class="list">${g.items.map(pwItem).join('')}</div>`).join('')}</section>`}
const seePwReport=()=>!usersOn()||(!!cu&&cu.role==='Admin');
function pwStats(){const t0=today();const wk=addDays(t0,PW_DAYS);
  const ppl=[...activeUsers().map(([id,u])=>({id,name:u.name||u.username,role:u.role,items:pendingFor(id)})),{id:'',name:'Open tasks (anyone)',role:'',items:openTasksPW()}];

    const done=tList().filter(t=>t.status==='done'&&t.doneAt&&(p.id?t.doneBy===p.id:false));const dd=n=>done.filter(t=>new Date(t.doneAt).toISOString().slice(0,10)>=addDays(t0,-n)).length;
    return {...p,over:c(x=>x.d&&!x.since&&x.d<t0),todayN:c(x=>x.d===t0&&!x.since),week:c(x=>x.d&&!x.since&&x.d>t0&&x.d<=wk),since:c(x=>x.since),nod:c(x=>!x.d),total:it.length,doneToday:dd(0),done7:dd(6)}})}

  if(partyId){const types=k==='buy'?['purchase','pchallan']:['sale','challan'];const last=vList().filter(v=>v.partyId===partyId&&types.includes(v.type)&&(v.items||[]).some(i=>i.pid===pid&&+i.rate)).sort(byDate).pop();

    let x=M;cols.forEach(([,w,al],k)=>{wr[k].forEach((ln,j)=>doc.text(ln,al==='r'?x+w-1.5:x+1.5,y+4.2+j*3.6,{size:8,align:al==='r'?'right':'left'}));x+=w});
    y+=h;doc.line(M,y,W-M,y)});
  y+=5;if(y>255){doc.addPage();y=20}
  (maskRate(v)?[]:[['Taxable value',R(t.taxable),false],['GST',R(t.tax),false],['Total',R(t.total),true]]).forEach(([a,b,bo])=>{doc.text(a,W-M-40,y,{align:'right',bold:bo,size:bo?11:9});doc.text(b,W-M,y,{align:'right',bold:bo,size:bo?11:9});y+=bo?6:4.8});
  const pg=need=>{if(y+need>280){doc.addPage();y=20}};
  if((v.payments||[]).length&&!maskRate(v)){y+=2;pg(16);doc.text(isP?'Payment made':'Payment received',M,y,{bold:true});y+=4.6;
    const pc=[['Date',26],['Type',28],['Ref / details',70],['Amount',30],['Balance',32]];let px=M;pc.forEach(([h,w],k)=>{doc.text(h,k>=3?px+w:px,y,{size:8,bold:true,align:k>=3?'right':'left'});px+=w});y+=4.3;
    payRows(v).forEach(r=>{pg(5);const xx=r.x;const cells=[fdate(r.date),(xx.mode||'')+(xx.st==='bounced'?' (bounced)':''),[xx.ref,xx.bank,xx.chqDate&&'dt '+fdate(xx.chqDate)].filter(Boolean).join(', '),R(xx.amount),R(r.bal)];let cx=M;pc.forEach(([,w],k)=>{doc.text(doc.wrap(cells[k],w-2,8)[0]||'',k>=3?cx+w:cx,y,{size:8,align:k>=3?'right':'left'});cx+=w});y+=4.3});y+=1;pg(6);doc.text('Balance due: '+R(Math.max(0,t.total-paidNow(v))),M,y,{bold:true});y+=6}
  if(v.note){pg(8);doc.wrap('Note: '+v.note,W-2*M,9).forEach(l=>{pg(5);doc.text(l,M,y);y+=4.3});y+=2}
  if(v.type==='sale'&&f.bank){pg(12);doc.text('Bank / UPI details',M,y,{bold:true});y+=4.6;f.bank.split('\n').forEach(l=>{pg(5);doc.text(l,M,y);y+=4.3})}
  y=Math.max(y+14,258);if(y>282){doc.addPage();y=40}
  doc.text('For '+(f.name||''),W-M,y-9,{align:'right'});doc.text('Authorised signatory',W-M,y,{align:'right'});doc.text(isC?'Received in good condition':"Receiver's signature",M,y);
  doc.text('Generated '+new Date().toLocaleString('en-IN'),M,290,{size:7,color:[0.45,0.45,0.45]});
  return new Blob([doc.output()],{type:'application/pdf'});
}

pushGuard();
